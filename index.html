<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bil-appen</title>
<style>
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --ink: #1c2433;
    --muted: #5d6778;
    --line: #d9dee6;
    --accent: #5b2a86;
    --accent-ink: #ffffff;
    --ok: #1f7a4d;
    --soon: #b36b00;
    --late: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 10px 0 4px; }
  input, select {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    font-size: 1rem;
    padding: 10px 16px;
    border-radius: 8px;
    border: 0;
    cursor: pointer;
    background: var(--accent);
    color: var(--accent-ink);
    margin-top: 14px;
  }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    margin: 0;
    padding: 4px 10px;
    font-size: .85rem;
  }
  .car-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .car-name { font-size: 1.3rem; font-weight: 600; }
  .muted { color: var(--muted); font-size: .9rem; }
  .item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }
  .item:first-child { border-top: 0; padding-top: 0; }
  .badge {
    font-size: .85rem;
    font-weight: 600;
    white-space: nowrap;
    padding: 2px 10px;
    border-radius: 99px;
    height: fit-content;
    border: 1.5px solid currentColor;
  }
  .ok { color: var(--ok); }
  .soon { color: var(--soon); }
  .late { color: var(--late); }
  .none { color: var(--muted); }
  .empty { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Bil-appen</h1>
  <p class="lead">Hold oversikt over bilen din og få beskjed om hva som snart må gjøres.</p>
  <div id="app"></div>
</main>

<script>
// ---- Hva appen holder styr på ----
// km = hvor mange km mellom hver gang, mnd = hvor mange måneder mellom hver gang.
// 0 betyr at den grensen ikke brukes. Tallene er forslag, ikke fasit: sjekk bilens servicehefte.
const TYPER = {
  olje:    { navn: "Service / oljeskift", km: 15000, mnd: 12 },
  eu:      { navn: "EU-kontroll",         km: 0,     mnd: 24 },
  dekk:    { navn: "Dekkskift",           km: 0,     mnd: 6  },
  bremser: { navn: "Bremser",             km: 40000, mnd: 24 },
  annet:   { navn: "Annet",               km: 0,     mnd: 0  }
};

// ---- Lagring i nettleseren ----
const NOKKEL = "bilapp-v1";
let state = { bil: null, logg: [] };

function last() {
  try {
    const t = localStorage.getItem(NOKKEL);
    if (t) state = JSON.parse(t);
  } catch (e) { /* ingen lagring tilgjengelig, vi fortsetter uten */ }
}
function lagre() {
  try { localStorage.setItem(NOKKEL, JSON.stringify(state)); } catch (e) {}
}

// ---- Hjelpefunksjoner ----
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function tall(n) { return Number(n).toLocaleString("nb-NO"); }
function idag() { return new Date().toISOString().slice(0, 10); }
function datoNorsk(iso) {
  return new Date(iso).toLocaleDateString("nb-NO", { day: "numeric", month: "short", year: "numeric" });
}
function leggTilMnd(iso, m) {
  const d = new Date(iso);
  d.setMonth(d.getMonth() + m);
  return d;
}
function dagerTil(dato) {
  return Math.round((dato - new Date()) / 86400000);
}

// ---- Beregn status for en type ----
function status(nokkel) {
  const t = TYPER[nokkel];
  const siste = state.logg
    .filter(l => l.type === nokkel)
    .sort((a, b) => b.dato.localeCompare(a.dato))[0];
  if (!siste) return { nivaa: "none", tekst: "Ikke registrert", detalj: "Legg inn forrige gang under «Registrer».", rang: 5 };

  let nivaa = "ok", deler = [], rang = 4;

  if (t.mnd) {
    const neste = leggTilMnd(siste.dato, t.mnd);
    const d = dagerTil(neste);
    deler.push("innen " + datoNorsk(neste.toISOString().slice(0, 10)));
    if (d < 0) { nivaa = "late"; rang = 0; }
    else if (d <= 30) { nivaa = "soon"; rang = Math.min(rang, 2); }
  }
  if (t.km && siste.km) {
    const nesteKm = Number(siste.km) + t.km;
    const igjen = nesteKm - state.bil.km;
    deler.push("ved " + tall(nesteKm) + " km");
    if (igjen < 0) { nivaa = "late"; rang = 0; }
    else if (igjen <= 1000 && nivaa !== "late") { nivaa = "soon"; rang = Math.min(rang, 2); }
  }

  const tekst = { ok: "I orden", soon: "Snart", late: "Over tid" }[nivaa];
  return { nivaa, tekst, detalj: "Sist " + datoNorsk(siste.dato) + ". Neste: " + deler.join(" eller ") + ".", rang };
}

// ---- Visning ----
function visOppsett() {
  return `
  <div class="card">
    <h2>Legg inn bilen din</h2>
    <form id="bilform">
      <div class="row">
        <div><label for="merke">Merke</label><input id="merke" required placeholder="Toyota"></div>
        <div><label for="modell">Modell</label><input id="modell" required placeholder="Yaris"></div>
      </div>
      <div class="row">
        <div><label for="aar">Årsmodell</label><input id="aar" type="number" min="1950" max="2100" required placeholder="2016"></div>
        <div><label for="km">Kilometerstand</label><input id="km" type="number" min="0" required placeholder="85000"></div>
      </div>
      <button type="submit">Lagre bil</button>
    </form>
  </div>`;
}

function visHoved() {
  const b = state.bil;
  const nokler = ["olje", "eu", "dekk", "bremser"];
  const lista = nokler.map(n => ({ n, s: status(n) })).sort((a, b) => a.s.rang - b.s.rang);

  const statusHtml = lista.map(({ n, s }) => `
    <div class="item">
      <div>
        <strong>${esc(TYPER[n].navn)}</strong><br>
        <span class="muted">${esc(s.detalj)}</span>
      </div>
      <span class="badge ${s.nivaa}">${s.tekst}</span>
    </div>`).join("");

  const opts = Object.keys(TYPER).map(k => `<option value="${k}">${esc(TYPER[k].navn)}</option>`).join("");

  const historikk = state.logg.length
    ? [...state.logg].sort((a, b) => b.dato.localeCompare(a.dato)).map(l => `
      <div class="item">
        <div>
          <strong>${esc(TYPER[l.type].navn)}</strong><br>
          <span class="muted">${datoNorsk(l.dato)}${l.km ? " · " + tall(l.km) + " km" : ""}${l.notat ? " · " + esc(l.notat) : ""}</span>
        </div>
        <button class="ghost" data-slett="${l.id}" aria-label="Slett denne oppføringen">Slett</button>
      </div>`).join("")
    : `<p class="empty">Ingenting registrert ennå.</p>`;

  return `
  <div class="card">
    <div class="car-head">
      <div>
        <div class="car-name">${esc(b.merke)} ${esc(b.modell)}</div>
        <div class="muted">${esc(b.aar)} · ${tall(b.km)} km</div>
      </div>
      <button class="ghost" id="endrebil">Endre bil</button>
    </div>
    <form id="kmform">
      <label for="nykm">Oppdater kilometerstand</label>
      <div class="row">
        <div><input id="nykm" type="number" min="0" value="${b.km}"></div>
        <div><button type="submit" style="margin-top:0">Oppdater</button></div>
      </div>
    </form>
  </div>

  <div class="card">
    <h2>Hva må gjøres</h2>
    ${statusHtml}
    <p class="muted" style="margin:12px 0 0">Intervallene er generelle forslag. Sjekk alltid servicehefte eller bilens egen plan.</p>
  </div>

  <div class="card">
    <h2>Registrer noe som er gjort</h2>
    <form id="loggform">
      <label for="type">Hva ble gjort?</label>
      <select id="type">${opts}</select>
      <div class="row">
        <div><label for="dato">Dato</label><input id="dato" type="date" value="${idag()}" max="${idag()}" required></div>
        <div><label for="lkm">Kilometerstand</label><input id="lkm" type="number" min="0" value="${b.km}"></div>
      </div>
      <label for="notat">Notat (valgfritt)</label>
      <input id="notat" placeholder="Verksted, pris, hva som ble byttet">
      <button type="submit">Lagre</button>
    </form>
  </div>

  <div class="card">
    <h2>Historikk</h2>
    ${historikk}
  </div>`;
}

function tegn() {
  document.getElementById("app").innerHTML = state.bil ? visHoved() : visOppsett();
  koble();
}

// ---- Knapper og skjemaer ----
function koble() {
  const $ = id => document.getElementById(id);

  if ($("bilform")) $("bilform").onsubmit = e => {
    e.preventDefault();
    state.bil = {
      merke: $("merke").value.trim(),
      modell: $("modell").value.trim(),
      aar: $("aar").value,
      km: Number($("km").value)
    };
    lagre(); tegn();
  };

  if ($("kmform")) $("kmform").onsubmit = e => {
    e.preventDefault();
    state.bil.km = Number($("nykm").value);
    lagre(); tegn();
  };

  if ($("endrebil")) $("endrebil").onclick = () => {
    if (confirm("Vil du bytte bil? Historikken beholdes.")) { state.bil = null; lagre(); tegn(); }
  };

  if ($("loggform")) $("loggform").onsubmit = e => {
    e.preventDefault();
    const km = $("lkm").value ? Number($("lkm").value) : 0;
    state.logg.push({
      id: Date.now(),
      type: $("type").value,
      dato: $("dato").value,
      km: km,
      notat: $("notat").value.trim()
    });
    if (km > state.bil.km) state.bil.km = km;
    lagre(); tegn();
  };

  document.querySelectorAll("[data-slett]").forEach(btn => {
    btn.onclick = () => {
      if (confirm("Slette denne oppføringen?")) {
        state.logg = state.logg.filter(l => l.id !== Number(btn.dataset.slett));
        lagre(); tegn();
      }
    };
  });
}

last();
tegn();
</script>
</body>
</html>
